services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
      DEMO_USER_ID: Team Apex Coders
      DEMO_PASSWORD: SIH@2026
      DEMO_MODE: "true"
    ports: ["8000:8000"]
    volumes:
      - ./data:/data:ro
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports: ["8080:80"]
    depends_on: [backend]
